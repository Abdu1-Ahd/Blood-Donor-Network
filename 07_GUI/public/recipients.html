<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipients - Blood Donor Network</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">BDN Admin</div>
        <div class="sidebar-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="donors.html">Donors</a>
            <a href="recipients.html" class="active">Recipients</a>
            <a href="requests.html">Requests</a>
            <a href="stock.html">Blood Stock</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h2>Recipients Management</h2>
            <div class="user-info">
                <span id="userName">User</span>
                <button class="btn btn-sm btn-secondary" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="content-wrapper">
            <!-- Add/Edit Form -->
            <div class="form-container">
                <h3 id="formTitle">Add New Recipient</h3>
                <form id="recipientForm">
                    <input type="hidden" id="recipient_id">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="full_name" required>
                        </div>
                        <div class="form-group">
                            <label>Blood Group</label>
                            <select id="blood_group" required>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Contact No</label>
                            <input type="text" id="contact_no" required pattern="[0-9-]+" title="Only numbers and dashes">
                        </div>
                        <div class="form-group">
                            <label>Ref. Hospital</label>
                            <select id="ref_hospital_id" required>
                                <!-- Populated by JS -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Admitted Date</label>
                            <input type="date" id="admitted_date" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">Save Recipient</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear</button>
                </form>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Group</th>
                            <th>Contact</th>
                            <th>Hospital</th>
                            <th>Admitted</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="recipientsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/recipients.js"></script>
</body>
</html>
