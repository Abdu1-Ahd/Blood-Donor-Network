<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Stock - Blood Donor Network</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">BDN Admin</div>
        <div class="sidebar-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="donors.html">Donors</a>
            <a href="recipients.html">Recipients</a>
            <a href="requests.html">Requests</a>
            <a href="stock.html" class="active">Blood Stock</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h2>Blood Stock Inventory</h2>
            <div class="user-info">
                <span id="userName">User</span>
                <button class="btn btn-sm btn-secondary" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="action-bar">
                <div class="form-group" style="flex-direction: row; align-items: center;">
                    <label style="margin-right: 10px;">Filter by Bank:</label>
                    <select id="filterBank" onchange="loadStock()">
                        <option value="">-- All Banks --</option>
                    </select>
                </div>
            </div>

            <!-- Add/Edit Form -->
            <div class="form-container">
                <h3 id="formTitle">Add/Update Stock Entry</h3>
                <form id="stockForm">
                    <input type="hidden" id="stock_id">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Blood Bank</label>
                            <select id="ref_bank_id" required></select>
                        </div>
                        <div class="form-group">
                            <label>Blood Group</label>
                            <select id="blood_group" required>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Units Available</label>
                            <input type="number" id="units_available" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">Save Entry</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear</button>
                </form>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Stock ID</th>
                            <th>Bank Name</th>
                            <th>Blood Group</th>
                            <th>Units Available</th>
                            <th>Last Updated</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stockTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/stock.js"></script>
</body>
</html>
