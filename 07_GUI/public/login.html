<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blood Donor Network</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2>Blood Donor Network</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="loginBtn" class="btn">Login</button>
        </form>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            
            if (!u || !p) {
                err.innerText = 'Please enter both username and password';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Logging in...';
            err.innerText = '';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data));
                    
                    // Role based redirection
                    if (data.role === 'Admin') {
                        window.location.href = 'dashboard.html';
                    } else if (data.role === 'Technician') {
                        window.location.href = 'donor_portal.html';
                    } else {
                        window.location.href = 'donor_portal.html';
                    }
                } else {
                    if (res.status === 400) err.innerText = 'Please enter both username and password';
                    else if (res.status === 401) err.innerText = 'Incorrect username or password';
                    else if (res.status === 500) err.innerText = 'Server error. Please try again later.';
                    else err.innerText = data.error || 'Login failed';
                }
            } catch (error) {
                err.innerText = 'Network error. Try again.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Login';
            }
        });
    </script>
</body>
</html>
